name: Engine.Core Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore Engine.Core.Tests/Engine.Core.Tests.csproj

      - name: Build tests
        run: dotnet build Engine.Core.Tests/Engine.Core.Tests.csproj --no-restore Debug

      - name: Run tests
        run: dotnet test Engine.Core.Tests/Engine.Core.Tests.csproj --no-build Debug --verbosity normal