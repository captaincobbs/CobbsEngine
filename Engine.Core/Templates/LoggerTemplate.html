<script>
  function toggleStackTrace(button) {
    const log = button.closest(".log");
    const pre = log?.querySelector("pre");
    if (!pre) return;
    pre.hidden = !pre.hidden;
    button.setAttribute("aria-expanded", String(!pre.hidden));
  }
  function toggleLogsByClass(className, button) {
    const logs = document.getElementById("logs");
    if (!logs || !button) return;
    const elements = logs.querySelectorAll(`.log.${className}`);
    const shouldHide = !button.classList.contains("disabled");
    elements.forEach(element => {
      element.classList.toggle("hidden", shouldHide);
    });
    button.classList.toggle("disabled", shouldHide);
    button.setAttribute("aria-pressed", String(!shouldHide));
  }
</script>
